name: Build and Release Electron App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build and Publish Electron App
        run: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Publish Draft Releases
        if: always()
        continue-on-error: true
        run: |
          try {
            $drafts = gh api repos/${{ github.repository }}/releases --jq '.[] | select(.draft == true) | {id: .id, hasYml: (.assets | map(.name) | contains(["latest.yml"]))}' | ConvertFrom-Json
            if ($drafts) {
              foreach ($d in $drafts) {
                try {
                  if ($d.hasYml) {
                    Write-Host "Publishing Full Release ID: $($d.id)"
                    gh api -X PATCH "repos/${{ github.repository }}/releases/$($d.id)" -F draft=false
                  } else {
                    Write-Host "Cleaning redundant draft ID: $($d.id)"
                    gh api -X DELETE "repos/${{ github.repository }}/releases/$($d.id)"
                  }
                } catch {
                  Write-Host "Draft operation notice: $_"
                }
              }
            }
          } catch {
            Write-Host "Release check completed: $_"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
