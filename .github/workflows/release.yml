name: Build and Release Electron App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and Publish Electron App
        run: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Publish Draft Releases
        if: success()
        run: |
          gh api repos/${{ github.repository }}/releases --jq '.[] | select(.draft == true) | .id' | ForEach-Object {
            Write-Host "Publishing Draft Release ID: $_"
            gh api -X PATCH "repos/${{ github.repository }}/releases/$_" -F draft=false
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
