name: CI — Lint & Test

on:
  push:
    branches: [ main, arena/*, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: ESLint + Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (must be 0 errors)
        run: npm run lint

      - name: Run Vitest (must be all green, no network tests)
        run: npm test

      - name: Verify architecture boundaries
        run: npm run test:arch

      - name: Build production bundle
        run: npm run build
