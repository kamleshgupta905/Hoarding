name: Build Android Staff APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android

      - name: Build Web Application
        run: npm run build
        env:
          VITE_APP_MODE: staff

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android Permissions (Camera & GPS)
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_PATH"
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/heera-staff-camera.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heera-Staff-Camera-APK
          path: output_apk/heera-staff-camera.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staff-apk-latest
          name: "📱 Heera Staff Camera Mobile App (Latest APK)"
          body: |
            ### 🚀 Heera Staff Camera Mobile App (Auto-Generated)
            
            This is the standalone Android Mobile App for ground staff.
            
            - 📸 **Instant Camera Launch:** Opens directly into the site capture viewfinder.
            - 📍 **Mandatory GPS Geofencing:** 50m radius billboard auto-matching with Gemini Vision AI.
            - ⚡ **Direct History Sync:** Zero manual review required.
            - 📶 **Offline Safe Queue:** Stores photos locally if mobile data is off and syncs automatically when online.
            
            👉 **Download & Install:** Download `heera-staff-camera.apk` below directly onto your Android device.
          files: output_apk/heera-staff-camera.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
