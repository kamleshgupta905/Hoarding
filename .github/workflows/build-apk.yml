name: 📱 Build Android Staff Camera APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 21 (Required for Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚡ Build Web Application (Vite)
        run: npm run build

      - name: 📱 Configure Capacitor & Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          if [ -d "resources/android/res" ]; then
            cp -r resources/android/res/* android/app/src/main/res/ 2>/dev/null || true
          fi
          npx cap sync android
          # Re-copy custom branding after cap sync to guarantee Capacitor defaults never overwrite Heera icons or splash screens
          if [ -d "resources/android/res" ]; then
            cp -r resources/android/res/* android/app/src/main/res/ 2>/dev/null || true
          fi

      - name: 🛡️ Inject Android Version, Permissions & Deep Linking
        run: |
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const version = pkg.version || "1.8.48";
          const parts = version.split(".").map(Number);
          const versionCode = (parts[0] || 1) * 10000 + (parts[1] || 0) * 100 + (parts[2] || 0);

          // 1. Update android/app/build.gradle with exact versionName and versionCode
          const gradlePath = "android/app/build.gradle";
          if (fs.existsSync(gradlePath)) {
            let gradle = fs.readFileSync(gradlePath, "utf8");
            gradle = gradle.replace(/versionCode\s+\d+/, "versionCode " + versionCode);
            gradle = gradle.replace(/versionName\s+["\'][^"\']+["\']/, "versionName \"" + version + "\"");
            fs.writeFileSync(gradlePath, gradle, "utf8");
            console.log("Updated Android build.gradle to versionName: " + version + " (code: " + versionCode + ")");
          }

          // 2. Update AndroidManifest.xml permissions and deep linking
          const path = "android/app/src/main/AndroidManifest.xml";
          if (fs.existsSync(path)) {
            let content = fs.readFileSync(path, "utf8");
            const permissions = `
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="false" />
            `;
            if (!content.includes("android.permission.CAMERA")) {
              content = content.replace("<application", permissions + "\n    <application");
            }
            const deepLinkFilter = `
                <intent-filter android:autoVerify="true">
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <category android:name="android.intent.category.BROWSABLE" />
                    <data android:scheme="https" android:host="hoarding-hd9a.vercel.app" android:pathPrefix="/staff" />
                </intent-filter>
            `;
            if (!content.includes("android:pathPrefix=\"/staff\"") && content.includes("</activity>")) {
              content = content.replace("</activity>", deepLinkFilter + "\n        </activity>");
            }
            fs.writeFileSync(path, content, "utf8");
            console.log("Injected permissions and staff deep linking into AndroidManifest.xml");
          }
          '

      - name: 🔨 Compile Android Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./heera-staff-camera.apk

      - name: 📦 Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: heera-staff-camera-apk
          path: ./heera-staff-camera.apk
          # The APK is ~211 MB and is also published to the staff-apk-latest
          # release, which is where staff actually download it. A long
          # retention here just consumed the shared Actions storage quota.
          retention-days: 3

      - name: 🚀 Publish APK to GitHub Releases (staff-apk-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload staff-apk-latest ./heera-staff-camera.apk --clobber || \
          gh release create staff-apk-latest ./heera-staff-camera.apk \
            --title "📱 Heera Staff Camera APK (Latest)" \
            --notes "Latest Android APK for Field Staff Camera. Includes live GPS Geofence (50m), Compass Facing HUD, and direct inventory sync." || true
