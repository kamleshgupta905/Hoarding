name: 🖥️ Build Admin Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: 🖥️ Build Admin Desktop App (.exe)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔢 Auto-Bump Version If Tag Exists (Ensures Auto-Update Always Triggers)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content -Raw -Path package.json | ConvertFrom-Json
          $tag = "v" + $pkg.version
          Write-Host "Checking if release tag $tag already exists..."
          $tagExists = git tag -l $tag
          if ($tagExists) {
              Write-Host "Tag $tag already exists! Auto-bumping patch version so electron-updater triggers update..."
              npm version patch --no-git-tag-version
              $newPkg = Get-Content -Raw -Path package.json | ConvertFrom-Json
              Write-Host "Updated Version to: $($newPkg.version)"
          } else {
              Write-Host "Version $tag is ready."
          }
          node scripts/sync-version.js

      - name: ⚡ Build Latest Admin Web & Package Desktop App (.exe)
        run: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILD: 'true'

      - name: 🚀 Ensure GitHub Release is Published with All Assets
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw -Path package.json | ConvertFrom-Json
          $tag = "v" + $pkg.version
          Write-Host "Publishing release $tag with latest.yml and exe installer..."
          gh release create $tag --title "Heera Advertising Admin v$($pkg.version)" --notes "Automated release with silent auto-updater support." 2>$null || true
          gh release edit $tag --draft=false || true
          Get-ChildItem dist_electron -Filter *.exe | ForEach-Object { gh release upload $tag $_.FullName --clobber }
          Get-ChildItem dist_electron -Filter latest.yml | ForEach-Object { gh release upload $tag $_.FullName --clobber }
          Get-ChildItem dist_electron -Filter *.blockmap | ForEach-Object { gh release upload $tag $_.FullName --clobber }

      - name: 🚀 Upload Windows Setup & Portable .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Heera-Advertising-Admin-Desktop-Windows
          path: |
            dist_electron/*.exe
            dist_electron/*.blockmap
            dist_electron/latest.yml
          retention-days: 30
