name: 🖥️ Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: 🖥️ Build Windows Desktop (.exe)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚡ Build Web App & Package Windows Desktop App (.exe)
        run: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILD: 'true'

      - name: 🚀 Ensure GitHub Release is Published with All Assets
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw -Path package.json | ConvertFrom-Json
          $tag = "v" + $pkg.version
          Write-Host "Publishing release $tag from draft if needed..."
          gh release edit $tag --draft=false || true
          Write-Host "Ensuring all binaries and latest.yml are attached to release $tag..."
          Get-ChildItem dist_electron -Filter *.exe | ForEach-Object {
              $dotName = $_.Name -replace '-', '.' -replace '\.exe$', '.exe'
              if ($dotName -ne $_.Name) {
                  Copy-Item $_.FullName (Join-Path $_.DirectoryName $dotName) -Force
              }
              $hyphenName = $_.Name -replace '\.', '-' -replace '-exe$', '.exe'
              if ($hyphenName -ne $_.Name) {
                  Copy-Item $_.FullName (Join-Path $_.DirectoryName $hyphenName) -Force
              }
          }
          Get-ChildItem dist_electron -Filter *.exe | ForEach-Object { gh release upload $tag $_.FullName --clobber }
          Get-ChildItem dist_electron -Filter latest.yml | ForEach-Object { gh release upload $tag $_.FullName --clobber }
          Get-ChildItem dist_electron -Filter *.blockmap | ForEach-Object { gh release upload $tag $_.FullName --clobber }

      - name: 🚀 Upload Windows Setup & Portable .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Heera-Advertising-Admin-Desktop-Windows
          path: |
            dist_electron/*.exe
            dist_electron/*.blockmap
            dist_electron/latest.yml
          retention-days: 30
