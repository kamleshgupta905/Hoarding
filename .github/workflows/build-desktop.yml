name: 🖥️ Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: 🖥️ Build Windows Desktop (.exe)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚡ Build Web App & Package Windows Desktop App (.exe)
        run: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILD: 'true'

      - name: 🚀 Upload Windows Setup & Portable .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Heera-Advertising-Admin-Desktop-Windows
          path: |
            dist_electron/*.exe
            dist_electron/*.blockmap
            dist_electron/latest.yml
          retention-days: 30
